services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: inventario_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - inventario

  nginx:
    image: nginx:alpine
    container_name: inventario_nginx
    ports:
      - "8010:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - inventario

  mysql:
    image: mysql:8.0
    container_name: inventario_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventario_ti
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario_pass
      MYSQL_ROOT_PASSWORD: root_inventario_2026
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3310:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - inventario

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: inventario_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8011:80"
    depends_on:
      - mysql
    networks:
      - inventario

networks:
  inventario:
    driver: bridge

volumes:
  dbdata:
